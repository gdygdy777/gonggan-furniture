name: 블로그 자동 동기화

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 08:00 KST
    - cron: '0 11 * * *'   # 매일 20:00 KST
  workflow_dispatch:        # 깃허브에서 '지금 실행' 수동 트리거

permissions:
  contents: write

concurrency:
  group: blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 네이버 블로그 → 사이트 데이터 갱신
        run: python3 scripts/sync_blog.py

      - name: 변경 있으면 커밋·배포
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 블로그 자동 동기화 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M' ) KST)"
          git push
