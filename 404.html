:root{--primary:#ff385c;--ink:#222;--body:#555;--muted:#888;--hairline:#e9e9ec;--surface:#f7f7f9;--r-full:999px}

.btn-primary{background:var(--primary);color:#fff}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--hairline)}
.quick{margin-top:30px;font-size:13.5px;color:var(--muted)}
.quick a{color:var(--primary);text-decoration:none;font-weight:600}
